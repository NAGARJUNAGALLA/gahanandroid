name: Build Signed APK and AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Global Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'

    # 1. Decode the keystore and save it to the absolute root workspace path
    - name: Decode Keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release-key.keystore

    # 2. Build and Sign the APK natively using the absolute path
    - name: Build and Sign Release APK
      run: >
        gradle assembleRelease
        -Pandroid.injected.signing.store.file=${{ github.workspace }}/release-key.keystore
        -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
        -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
        -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    # 3. Build and Sign the AAB natively using the absolute path
    - name: Build and Sign Release AAB
      run: >
        gradle bundleRelease
        -Pandroid.injected.signing.store.file=${{ github.workspace }}/release-key.keystore
        -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}
        -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }}
        -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    # 4. Upload the perfectly signed APK
    - name: Upload Signed APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JCV_Mock_Tests_Signed_APK
        path: app/build/outputs/apk/release/app-release.apk

    # 5. Upload the perfectly signed AAB
    - name: Upload Signed AAB as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JCV_Mock_Tests_Signed_AAB
        path: app/build/outputs/bundle/release/app-release.aab
