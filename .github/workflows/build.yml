name: Build Signed APK and AAB

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Added so you can trigger it manually whenever you want

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Global Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6' # Forces the correct, compatible Gradle version

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Build Release AAB
      run: gradle bundleRelease

    - name: Sign Release APK
      uses: r0adkll/sign-android-release@v1
      id: sign_apk
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Sign Release AAB
      uses: r0adkll/sign-android-release@v1
      id: sign_aab
      with:
        releaseDirectory: app/build/outputs/bundle/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload Signed APK as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JCV_Mock_Tests_Signed_APK
        path: ${{steps.sign_apk.outputs.signedReleaseFile}}

    - name: Upload Signed AAB as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JCV_Mock_Tests_Signed_AAB
        path: ${{steps.sign_aab.outputs.signedReleaseFile}}
